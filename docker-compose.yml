# EcoVolt DW: SQL Server 2022 (Linux container) + Cube Core (Playground on http://localhost:4000).
# Works the same on native Linux (Docker Engine + compose plugin) and on Windows/WSL2
# (Docker Desktop with WSL integration, or Docker Engine installed inside the WSL distro).
#
#   docker compose up -d                  start SQL Server and Cube
#   ./run_sql.sh without_partitions       create + load the warehouse (see README.md)
#   docker compose logs -f cube           Cube log
#   docker compose down                   stop (data stays in the mssql-data volume)
#   docker compose down -v                stop and delete the database files
#
# SQL Server installed natively on this Linux machine instead of the container:
#   set CUBEJS_DB_HOST=host.docker.internal and MSSQL_IN_DOCKER=false in .env, then
#   docker compose up -d --no-deps cube
name: ecovolt

services:
  mssql:
    # SQL Server 2022: needed for ordered columnstore indexes (CREATE CLUSTERED COLUMNSTORE INDEX ... ORDER).
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: ecovolt-mssql
    hostname: ecovolt-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      TZ: Etc/UTC
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      # Named volume for the database files: no permission problems with bind mounts
      # (container user mssql = uid 10001; NTFS paths under /mnt/c on WSL do not work for data files).
      - mssql-data:/var/opt/mssql
      # Generator output (T1/, T2/, T2_delta/) -> BULK INSERT paths /dw_data/T1/... and /dw_data/T2/...
      # On SELinux hosts (Fedora/RHEL) use ":ro,z" instead of ":ro".
      - ${DATA_DIR:-../Data}:/dw_data:ro
      # This folder -> the SQL scripts are run inside the container by run_sql.sh.
      - .:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  cube:
    image: cubejs/cube:latest
    container_name: ecovolt-cube
    depends_on:
      mssql:
        condition: service_healthy
    env_file: .env
    ports:
      - "4000:4000"
    volumes:
      # Data model (energy_production.cube.yml); Cube reloads it automatically in development mode.
      - ./model:/cube/conf/model
    extra_hosts:
      # Lets the container reach a SQL Server running on the host (native Linux needs this mapping;
      # Docker Desktop on WSL provides host.docker.internal itself - the mapping does no harm there).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  mssql-data:
