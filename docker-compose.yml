# Containers running as part of the EcoVolt data warehouse environment.
services:
  # Microsoft SQL Server instance that stores the data warehouse databases (EcoVoltDW, EcoVoltDW_Part)
  # and, for the ETL stage, the source database PowerMaster.
  mssql:
    # SQL Server 2025 image; ordered columnstore indexes (CREATE CLUSTERED COLUMNSTORE INDEX ... ORDER) need 2022 or newer.
    image: mcr.microsoft.com/mssql/server:2025-latest
    # SQL Server images exist only for amd64; on ARM machines Docker runs them through emulation.
    platform: linux/amd64
    # A fixed, readable container name instead of one generated by Compose.
    container_name: mssql-db
    environment:
      # "Y" confirms acceptance of the Microsoft EULA, which is required to run SQL Server.
      ACCEPT_EULA: "Y"
      # Password for the built-in "sa" administrator; it must meet the SQL Server password policy.
      # In production, this value should be supplied through a secret or an .env file.
      MSSQL_SA_PASSWORD: "EcoVolt_Strong_Pass_2025"
      # All dates and times of the warehouse are UTC.
      TZ: Etc/UTC
    volumes:
      # A named volume preserves database files when the container is removed or recreated.
      - mssql_data:/var/opt/mssql
      # Mounts the sample data in the container, for the BULK INSERT commands of 03_bulk_load.sql.
      - ./bulk:/dw_data/bulk:ro
      # Generator output (T1/, T2/, T2_delta/): the source files for the ETL stage (etl_process_scripts/).
      - ./Data:/dw_data/sources:ro
      # The repository, so that sqlcmd running inside the container (run.sh) can execute the scripts (sqlcmd -i).
      - .:/sql:ro
    ports:
      # Maps host port 1433 to container port 1433, the default SQL Server port.
      - "1433:1433"
    networks:
      # The shared network lets other services connect to the database using hostname "mssql".
      - data-net

  # Cube provides a semantic layer and analytics API over the SQL Server database.
  cube:
    # The newest available Cube image; pinning a specific version is recommended in production.
    image: cubejs/cube:latest
    # A fixed name for the Cube service container.
    container_name: cube-core
    ports:
      # Exposes the Cube API and development interface on host port 4000.
      - "4000:4000"
    environment:
      # Enables Cube development mode, including diagnostic tools and the Playground interface.
      - CUBEJS_DEV_MODE=true
      # Selects the Microsoft SQL Server data-source driver.
      - CUBEJS_DB_TYPE=mssql
      # The Compose service name "mssql" is the database server address on the shared network.
      - CUBEJS_DB_HOST=mssql
      # Port on which SQL Server listens inside the container network.
      - CUBEJS_DB_PORT=1433
      # Name of the data warehouse database to which Cube connects.
      # EcoVoltDW = without_partitions, EcoVoltDW_Part = with_partitions.
      - CUBEJS_DB_NAME=EcoVoltDW
      # SQL Server administrator login used by Cube to connect to the database.
      - CUBEJS_DB_USER=sa
      # Password for the user above; it must match MSSQL_SA_PASSWORD.
      # In production, it should be stored as a secret.
      - CUBEJS_DB_PASS=EcoVolt_Strong_Pass_2025
      # Secret used by Cube to sign and verify JWTs, among other purposes.
      # Replace this example with a strong random secret stored outside the repository.
      - CUBEJS_API_SECRET=ecovolt-dev-secret-change-me
      # Cube model directory inside /cube/conf; it matches the mounted directory below.
      - CUBEJS_SCHEMA_PATH=model
      # Disables SSL encryption for the SQL Server connection on the local container network.
      - CUBEJS_DB_SSL=false
      # Disables sending anonymous usage statistics to Cube.
      - CUBEJS_TELEMETRY=false
    volumes:
      # Mounts local model definitions as the model directory selected by CUBEJS_SCHEMA_PATH.
      - ./cube/schema:/cube/conf/model
    depends_on:
      # Starts the mssql container before Cube; this does not guarantee database readiness.
      - mssql
    networks:
      # Connects Cube to the same network as SQL Server.
      - data-net

# Named volumes managed by Docker Compose.
volumes:
  # Persistent storage for SQL Server data.
  mssql_data:

# Networks used for communication between containers.
networks:
  data-net:
    # Standard local Docker network that provides service-name DNS and isolation.
    driver: bridge
