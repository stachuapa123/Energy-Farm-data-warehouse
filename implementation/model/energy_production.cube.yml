# In Cube Core, a cube is a logical semantic model over a SQL source that defines measures, dimensions, and joins; Cube generates SQL for queries.
# It is not a stored multidimensional OLAP cube with precomputed cells; Cube pre-aggregations are configured separately when needed.
# This cube sits on the One Big Table of the EcoVolt warehouse (star schema ENERGY_PRODUCTION + UNIT, ZONE, STATUS, WEATHER, DATE, TIME).
# Measures are aggregated values, dimensions are attributes for filtering or grouping. All dates and times are UTC.
cubes:
  - name: EnergyProduction
    # To use the materialized table instead of this view, set sql_table to dbo.FLAT_TABLE.
    sql_table: dbo.FlatTable
    #sql_table: dbo.FLAT_TABLE
    title: Energy Production
    description: >
      Energy production semantic model built on the denormalized FlatTable view. Each row
      represents the energy produced by one generation unit within one hour, with the unit's
      model and manufacturer, zone, operational status, the weather of the hour and the day,
      and the date and time of the reading.

    measures:
      - name: readingsCount
        type: count
        description: Number of readings (one reading = one unit within one hour).

      - name: totalEnergy
        sql: EnergyProduced
        type: sum
        format: number_2
        description: Total Energy Produced in kWh (sum of EnergyProduced).

      - name: maxPossibleEnergy
        sql: MaxPossibleEnergy
        type: sum
        format: number_2
        description: Energy the units would produce at full power capacity, in kWh.

      # Weather measures are non-additive: they are only averaged. The weather is stored per zone and hour
      # but repeated for every unit of the zone, so these averages are weighted by the number of units.
      - name: avgTemperature
        sql: AvgTemperature
        type: avg
        format: number_2
        description: Average air temperature in degC.

      - name: avgWindSpeed
        sql: AvgWindSpeed
        type: avg
        format: number_2
        description: Average wind speed in m/s (measured at 10 m).

      - name: avgPrecipitation
        sql: Precipitation
        type: avg
        format: number_2
        description: Average hourly precipitation in mm.

      - name: avgCloudCover
        sql: CloudCover
        type: avg
        format: number_2
        description: Average cloud cover in oktas (0-8).

      - name: avgSunshineDuration
        sql: SunshineDuration
        type: avg
        format: number_2
        description: Average minutes of sunshine per hour.

      - name: unitsCount
        sql: UnitID
        type: count_distinct
        description: Number of distinct units.

      - name: unitDays
        sql: UnitDayKey
        type: count_distinct
        description: Number of distinct combinations of unit and day (denominator of the average daily energy per unit).

      - name: daysCount
        sql: "{CUBE}.DateKey"
        type: count_distinct
        description: Number of distinct days.

      - name: operatingHours
        type: count
        # filters restrict the rows that are counted; the condition is added to the SQL of this measure only.
        filters:
          - sql: "{CUBE}.IsOperating = 1"
        description: Number of operating hours (readings with status Operating).

      - name: avgHourlyEnergy
        # 1.0 * ... converts to decimal; NULLIF(..., 0) prevents division by zero.
        sql: "1.0 * {totalEnergy} / NULLIF({readingsCount}, 0)"
        type: number
        format: number_2
        description: Average energy produced by a unit within one hour, in kWh.

      - name: avgDailyEnergyPerUnit
        sql: "1.0 * {totalEnergy} / NULLIF({unitDays}, 0)"
        type: number
        format: number_2
        description: Average energy produced by one unit within one day, in kWh.

      - name: avgDailyEnergy
        sql: "1.0 * {totalEnergy} / NULLIF({daysCount}, 0)"
        type: number
        format: number_2
        description: Average energy produced by the whole selection within one day, in kWh.

      - name: capacityFactor
        sql: "1.0 * {totalEnergy} / NULLIF({maxPossibleEnergy}, 0)"
        type: number
        format: percent_2
        description: Efficiency - energy produced divided by the maximum possible energy.

      - name: availability
        sql: "1.0 * {operatingHours} / NULLIF({readingsCount}, 0)"
        type: number
        format: percent_2
        description: Share of hours in which the units were operating.

      # --- Time-shifted measures (multi-stage, Tesseract planner) ---
      # multi_stage first aggregates the energy per period, then fetches the value of the shifted period.
      - name: previousMonthEnergy
        sql: "{totalEnergy}"
        type: number
        multi_stage: true
        time_shift:
          - time_dimension: readingDate
            interval: 1 month
            type: prior
        format: number_2
        description: >
          Total energy of the immediately preceding calendar month. Query by readingDate at month granularity.

      - name: energyChangeVsPreviousMonth
        sql: "CASE WHEN {previousMonthEnergy} > 0 THEN 1.0 * ({totalEnergy} - {previousMonthEnergy}) / NULLIF({previousMonthEnergy}, 0) END"
        type: number
        multi_stage: true
        format: percent_2
        description: >
          Month-over-month change of the total energy (0.05 = +5 %). NULL if the previous month had no energy.

      - name: sameMonthLastYearEnergy
        sql: "{totalEnergy}"
        type: number
        multi_stage: true
        time_shift:
          - time_dimension: readingDate
            interval: 1 year
            type: prior
        format: number_2
        description: >
          Total energy of the same period one year earlier. Query by readingDate at month granularity.

      - name: energyChangeVsSameMonthLastYear
        sql: "CASE WHEN {sameMonthLastYearEnergy} > 0 THEN 1.0 * ({totalEnergy} - {sameMonthLastYearEnergy}) / NULLIF({sameMonthLastYearEnergy}, 0) END"
        type: number
        multi_stage: true
        format: percent_2
        description: >
          Year-over-year change of the total energy for the same month (0.05 = +5 %).

      # --- Fallback for the legacy planner (CUBEJS_TESSERACT_SQL_PLANNER=false): rolling windows ---
      # offset: start -> the window ends where the queried period starts. Require readingDate with month granularity.
      - name: previousMonthEnergyRolling
        sql: EnergyProduced
        type: sum
        rolling_window:
          trailing: 1 month
          offset: start
        format: number_2
        description: Total energy of the previous month (rolling-window variant of previousMonthEnergy).

      - name: energyLast12MonthsRolling
        sql: EnergyProduced
        type: sum
        public: false
        rolling_window:
          trailing: 12 month
          offset: start

      - name: energyLast11MonthsRolling
        sql: EnergyProduced
        type: sum
        public: false
        rolling_window:
          trailing: 11 month
          offset: start

      - name: sameMonthLastYearEnergyRolling
        # [start - 12 months, start) minus [start - 11 months, start) = the same month one year earlier
        sql: "{energyLast12MonthsRolling} - {energyLast11MonthsRolling}"
        type: number
        format: number_2
        description: Total energy of the same month last year (rolling-window variant of sameMonthLastYearEnergy).

    dimensions:
      - name: productionLogId
        sql: ProductionLogID
        type: number
        primary_key: true
        public: true
        description: Identifier of the reading in the source system (degenerate dimension, grain of the cube).

      - name: readingDate
        sql: "CAST({CUBE}.Date AS DATETIME2)"
        type: time
        description: Calendar date of the reading (use it for date ranges and day/month/quarter/year granularity).

      - name: readingDateTime
        sql: ReadingDateTime
        type: time
        description: Date and hour of the reading (UTC).

      - name: unitId
        sql: UnitID
        type: string
        description: Identifier of the generation unit (e.g. WT-GDA-01, PV-POZ-03).

      - name: unitType
        sql: UnitType
        type: string
        description: "Type of the unit: Wind or Solar."

      - name: modelName
        sql: ModelName
        type: string
        description: Equipment model of the unit (version valid at the reading time).

      - name: manufacturerName
        sql: ManufacturerName
        type: string
        description: Manufacturer of the unit (version valid at the reading time).

      - name: manufacturerCountry
        sql: ManufacturerCountry
        type: string
        description: Country of the manufacturer.

      - name: maxPowerCapacity
        sql: MaxPowerCapacity
        type: number
        description: Maximum power output of the unit in kW.

      - name: unitAge
        sql: UnitAge
        type: number
        description: Whole years between the installation of the unit's equipment and the reading.

      - name: ageCategory
        sql: AgeCategory
        type: string
        description: "Unit age at the reading: under 1 year, 1-5 years, 5-10 years, over 10 years."

      - name: olderUnit
        sql: OlderUnit
        type: string
        description: "Yes if the unit was over 5 years old at the reading."

      - name: oldestWindTurbine
        sql: OldestWindTurbine
        type: string
        description: "Yes for the wind turbine with the earliest installation date (all its SCD2 versions)."

      - name: zoneName
        sql: ZoneName
        type: string
        description: Zone of the farm in which the unit is located.

      - name: operationalStatus
        sql: OperationalStatus
        type: string
        description: "Status of the unit during the hour: Operating, Fault, Maintenance."

      - name: isOperating
        sql: IsOperating
        type: number
        description: 1 if the unit was operating, otherwise 0.

      - name: temperatureCategory
        sql: AvgTemperatureCategory
        type: string
        description: "Temperature of the hour: freezing, cold, moderate, warm, hot (>= 30 degC)."

      - name: windSpeedCategory
        sql: AvgWindSpeedCategory
        type: string
        description: "Wind speed of the hour: calm, light, moderate, strong (>= 9 m/s)."

      - name: precipitationCategory
        sql: PrecipitationCategory
        type: string
        description: "Precipitation of the hour: none, light, moderate, heavy."

      - name: cloudCoverCategory
        sql: CloudCoverCategory
        type: string
        description: "Cloud cover of the hour: clear, partly cloudy, overcast."

      - name: sunshineDurationCategory
        sql: SunshineDurationCategory
        type: string
        description: "Sunshine of the hour: none, low, medium, high, full."

      - name: skyConditionOfDay
        sql: SkyConditionOfDay
        type: string
        description: "Daily mean cloud cover of the zone: Sunny (< 2 oktas), Cloudy (> 6 oktas), Partly cloudy."

      - name: dailyWindSpeedCategory
        sql: DailyWindSpeedCategory
        type: string
        description: "Daily mean wind speed of the zone: calm, light, moderate, strong (>= 9 m/s)."

      - name: optimalWeatherDay
        sql: OptimalWeatherDay
        type: string
        description: "Yes for a wind unit on a strong-wind day or a solar unit on a Sunny day."

      - name: productionYear
        sql: "{CUBE}.Year"
        type: number
        description: Year of the reading.

      - name: productionQuarter
        sql: QuarterNo
        type: number
        description: Quarter of the reading (1-4).

      - name: productionMonth
        sql: "{CUBE}.Month"
        type: string
        description: Month name of the reading.

      - name: productionMonthNo
        sql: MonthNo
        type: number
        description: Month number of the reading (use it to sort months).

      - name: productionDayOfWeek
        sql: DayOfWeek
        type: string
        description: Day of week of the reading.

      - name: season
        sql: Season
        type: string
        description: "Season of the reading: Winter, Spring, Summer, Autumn."

      - name: timeOfDay
        sql: TimeOfDay
        type: string
        description: "Time of day of the reading: night, morning, afternoon, evening."

      - name: productionHour
        sql: "{CUBE}.Hour"
        type: number
        description: Hour of the reading, from 0 through 23 (UTC).

    hierarchies:
      - name: manufacturerHierarchy
        title: Unit by Manufacturer
        levels:
          - manufacturerCountry
          - manufacturerName
          - modelName
          - unitId

      - name: unitTypeHierarchy
        title: Unit by Type
        levels:
          - unitType
          - modelName
          - unitId

      - name: unitAgeHierarchy
        title: Unit Age
        levels:
          - olderUnit
          - ageCategory

      - name: statusHierarchy
        title: Status
        levels:
          - isOperating
          - operationalStatus

      - name: productionDateHierarchy
        title: Production Date
        levels:
          - productionYear
          - productionQuarter
          - productionMonth
          - readingDate

      - name: productionDayOfWeekHierarchy
        title: Production Day of Week
        levels:
          - productionYear
          - productionMonth
          - productionDayOfWeek
          - readingDate

      - name: productionTimeHierarchy
        title: Production Time of Day
        levels:
          - timeOfDay
          - productionHour
